# The selling demo: empties the demo database, migrates it, loads the
# standard demo and dresses it as Arvela Group (docs/demo-showcase.md).
#
# Run by hand only (Actions → "Demo — reset" → Run workflow), and only
# against the demo database: the run is refused unless the host typed matches
# the DEMO_SEED_TARGET secret, and the seed's own guard checks it again. It
# never touches rozaris.com's database — that URL is not a secret here.
name: Demo — reset

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: The demo database host, typed out (as in the DEMO_SEED_TARGET secret)
        required: true
      files:
        description: Where the demo's files go. "none" while Supabase storage is unavailable — the records are all there, but their files are not.
        type: choice
        options: [supabase, none]
        default: supabase

concurrency:
  group: demo-showcase
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: demo
    env:
      # The demo database's direct (non-pooling) URL: migrations need a session connection.
      DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DEMO_DATABASE_URL }}
      NESTO_SEED_TARGET: ${{ secrets.DEMO_SEED_TARGET }}
      NESTO_DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
      NESTO_DEMO_ADMIN_PASSWORD: ${{ secrets.DEMO_ADMIN_PASSWORD }}
      NESTO_DEMO_SIGN_IN: temporary
      # A hosted demo: the seed guard refuses production and staging, never this.
      APP_ENV: demo
      # The demo's files go to the demo project's own bucket, where its site reads them
      # ("none": to the runner's disk, which is thrown away).
      STORAGE_DRIVER: ${{ inputs.files == 'none' && 'local' || 'supabase' }}
      STORAGE_BUCKET: ${{ secrets.DEMO_STORAGE_BUCKET }}
      SUPABASE_URL: ${{ secrets.DEMO_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.DEMO_SUPABASE_SECRET_KEY }}
    steps:
      - name: The host typed is the demo database
        env:
          TYPED: ${{ inputs.confirm }}
        run: test -n "$NESTO_SEED_TARGET" && test "$TYPED" = "$NESTO_SEED_TARGET"

      # Supabase's pooler host is shared by every project in the region, so the
      # host alone cannot tell the demo from the live database: refuse the live one by its project id.
      - name: Never the live database
        run: |
          case "$DATABASE_URL" in
            *ccsjhrcvooukyiarxovf*) echo "DEMO_DATABASE_URL points at the live rozaris.com database. Refusing."; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Supabase keeps the btree_gist extension in public, so Prisma cannot drop
      # the schema and falls back to dropping tables, views and types only. Drop
      # the app's own functions first, or the migration that creates one fails.
      - name: Empty and migrate the demo database
        run: |
          pnpm prisma db execute --url "$DATABASE_URL" --stdin <<'SQL'
          DO $$
          DECLARE r record;
          BEGIN
            FOR r IN
              SELECT p.oid::regprocedure AS routine
              FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'public' AND p.proowner = current_user::regrole
                AND p.prokind IN ('f', 'p')
                AND NOT EXISTS (SELECT 1 FROM pg_depend d WHERE d.classid = 'pg_proc'::regclass AND d.objid = p.oid AND d.deptype = 'e')
            LOOP
              EXECUTE 'DROP ROUTINE ' || r.routine || ' CASCADE';
            END LOOP;
          END $$;
          SQL
          pnpm prisma migrate reset --force --skip-seed

      - name: Roles, permissions and modules
        run: pnpm tsx scripts/access-sync.ts

      - name: The standard demo
        run: pnpm tsx prisma/seed.ts

      - name: Dressed as Arvela Group
        run: pnpm tsx prisma/seed-showcase.ts
