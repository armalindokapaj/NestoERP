name: CI

# Pipeline order per PRD #9 §200: install → lint → typecheck → build →
# database → migrations → seed → unit → integration → API → critical E2E.
#
# Any failure in migration, seed validation, authorisation, cross-company
# isolation or a critical E2E flow fails the build (PRD #9 §201, §202).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nesto_test?schema=public
  AUTH_SECRET: ci-only-secret-not-used-in-any-deployment
  AUTH_TRUST_HOST: "true"
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
  NESTO_DEMO_PASSWORD: ci-demo-password
  NODE_ENV: test

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        # A dedicated database per run: integration tests never touch a
        # development, staging or production database (PRD #9 §125, §244).
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nesto_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Migration drift check
        # A schema edited without a matching migration would apply cleanly here
        # and fail in production instead (PRD #34 §204, PRD #37 §177).
        run: pnpm db:drift

      - name: Fresh-install migration test
        # Empty database, every migration from zero (PRD #34 §293, PRD #37 §178).
        run: pnpm db:deploy

      - name: Seed demo data
        run: pnpm db:seed

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

      - name: API authorisation tests
        run: pnpm test:api

      - name: Build
        run: pnpm build

      - name: Production guard checks
        # The DEV role switcher and the demo seed must be impossible in a
        # production build (PRD #34 §52, §53, PRD #30 §261, §264).
        run: pnpm verify:production-guards

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    # Runs alongside verify rather than after it: a dependency advisory should
    # not wait on a Playwright run (PRD #34 §363).
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Dependency audit
        # Known exploitable critical/high advisories block the release
        # (PRD #34 §47, §50, PRD #30 §251).
        run: pnpm audit --audit-level high

      - name: Secret scan
        # History as well as the diff: a secret committed and later removed is
        # still a leaked secret (PRD #34 §48, PRD #30 §256).
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Static analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: CodeQL analysis
        uses: github/codeql-action/analyze@v3
